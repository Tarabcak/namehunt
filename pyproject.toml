[project]
name = "namehunt"
version = "0.2.0"
description = "Closed-loop startup naming: LLM candidates checked against real RDAP domain availability"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Róbert Tarabčák" },
    { name = "Norbert Ďurčanský" },
]
keywords = ["naming", "domains", "rdap", "startup", "llm", "claude", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.121.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "whoisit>=4.0.4",
]

[project.urls]
Homepage = "https://github.com/Tarabcak/namehunt"

[project.scripts]
namehunt = "namehunt.cli:main"

[project.optional-dependencies]
openai = [
    "openai>=2.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/namehunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["whoisit.*", "openai.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
